<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BENEFICARY REGISTRATION FORM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="icon" type="image/x-logo" href="path/to/fca-logo.jpg">
  </head>
  <style>
    body {
      background-color: rgb(240, 241, 238);
      align-items: left;
      padding: 20px;
    }
    .logo {
      width: 180px;
      height: auto;
      display: left;
      margin: 0 auto 15px;
      
    }
    h1 {
      font-size: 1.25rem;
      color: #316e34;
      text-align: center;
      margin-bottom: 20px;
    }
    .btn-primary {
      background-color: #10ff4c;
      border-color: #fcfeff;
      align-items:end;
      color: #f6f9f5;
    }
  </style>
  <body>
    <img src="fca-logo.jpg" alt="FCA logo" class="logo">
    <h1>BENEFICARY REGISTRATION FORM</h1>
    <form id="form">
  
  <div class="mb-3" >
    <input type="text" class="form-control" placeholder="First name" aria-label="First name">
  </div>
  <div class="col">
    <input type="text" class="form-control" placeholder="Last name" aria-label="Last name">
     <span id="name_error"></span>
  </div>
</div>

<div class="mb-3" >
    <input id="dateOfBirth" class="form-control" placeholder="Date of birth" aria-label="Date of birth" placeholder="DD/MM/YYYY">        
  </div>
  <div class="col">
    <input type="text" class="form-control" placeholder="Place of birth" aria-label="Place of birth">
  </div>
</div>

<div class="form-check">
  <input class="form-check-input" type="radio" name="exampleRadios" id="exampleRadios1" value="option1" checked>
  <label class="form-check-label" for="exampleRadios1">
    Male
  </label>
</div>
<div class="form-check">
  <input class="form-check-input" type="radio" name="exampleRadios" id="exampleRadios2" value="option2">
  <label class="form-check-label" for="exampleRadios2">
    Female
  </label>
</div>

<select id="Nationality" class="form-select" aria-label="Nationality ">
  <option selected> Nationality</option>
  <option value="1">Ugandan</option>
  <option value="2">Kenyan</option>
  <option value="3">Tanzanian</option>
  <option value="4">Brundian</option>
  <option value="4">Rwandese</option>
<option value="4">Somali</option>  
<option value="4">South Sudanese</option>
  
</select>


<select id="MaritalStatus" class="form-select" aria-label="marital status ">
  <option selected> Marital Status</option>
  <option value="1">Single</option>
  <option value="2">Married</option>
  <option value="3">Divorced</option>
  <option value="4">Widowed</option>
<option value ="5">Separated</option>
    
</select>

<select id="SettlementCamp" class="form-select" aria-label="settlement camp ">
  <option selected> Settlement Camp</option>
  <option value="1"> Gulu settlement Camp </option>
  <option value="2"> arua settlement Camp </option>
  <option value="3"> mbarara settlement Camp </option>
  <option value="4"> kasese settlement Camp 4</option>
</select>

<div class="mb-3">
    <label  class="form-label">Date</label>
    <input type="text" class="form-control" id="date" placeholder="DD/MM/YYYY" required >
  </div>

  <button type="button" class="btn btn-primary">register</button>
</form>
    


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="validations.js">
    <link rel="stylesheet" href="landing page.html">

  </body>
</html>
